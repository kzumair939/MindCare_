# ─────────────────────────────────────────────
# SERVER
# ─────────────────────────────────────────────
server.port=8080
server.forward-headers-strategy=framework

# ── Tomcat Thread Pool (Cloud & Container Optimized) ──
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:2000}
server.tomcat.connection-timeout=20000

# ── HTTP Response Compression (GZIP) ──
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# ─────────────────────────────────────────────
# DATABASE (Docker MySQL)
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://mysql:3306/DB_1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP Connection Pool (Compatible with Cloud Free Tiers & Aiven Max Connections) ──
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=MindCareHikariCP

# ─────────────────────────────────────────────
# JPA / HIBERNATE
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ─────────────────────────────────────────────
# JWT SECURITY — 15-MINUTE SHORT-LIVED ACCESS TOKEN + 7-DAY ROTATING REFRESH TOKEN
# ─────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-days=7

# ─────────────────────────────────────────────
# CORS — allow both Vite dev server and nginx prod
# ─────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# ─────────────────────────────────────────────
# EMAIL (GMAIL SMTP / SENDMAIL)
# ─────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# ─────────────────────────────────────────────
# GOOGLE OAUTH2
# ─────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ─────────────────────────────────────────────
# APP SETTINGS
# ─────────────────────────────────────────────
app.base-url=http://localhost:8080
app.frontend.url=http://localhost
app.free.sessions=2
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@example.com}

# ─────────────────────────────────────────────
# STRIPE (TEST KEYS)
# ─────────────────────────────────────────────
stripe.api.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}

# ─────────────────────────────────────────────
# FILE UPLOAD
# ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─────────────────────────────────────────────
# GEMINI AI CONFIGURATION
# ─────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}


# ─────────────────────────────────────────────
# ERROR DEBUGGING & INFORMATION DISCLOSURE PROTECTION
# ─────────────────────────────────────────────
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING:never}
server.error.include-stacktrace=never

